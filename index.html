<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Johnty Paul Joseph — UI/UX &amp; Product Designer</title>
<meta name="description" content="Portfolio of Johnty Paul Joseph, UI/UX and product designer working on enterprise HRMS and Payroll software.">
<meta property="og:title" content="Johnty Paul Joseph — UI/UX &amp; Product Designer">
<meta property="og:description" content="Enterprise HRMS and Payroll design, a live recruitment platform, and a ride-booking concept.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<noscript>This portfolio needs JavaScript. Email: johntypaul35@gmail.com</noscript>

<!-- Canvas: frames are generated from js/data.js -->
<div id="viewport">
  <div id="canvas">
    <div id="cursor"><div class="cin"><svg viewBox="0 0 24 24"><path d="M3 2l17 8-7.2 2.2L10 19z" fill="#7B61FF" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Johnty</span></div></div>
    <div id="selection"><i></i><i></i><i></i><i></i><b></b></div>
  </div>
</div>

<!-- Editor chrome -->
<div class="ui" id="topbar">
  <div class="tb-left">
    <button class="iconbtn" id="btnLayers" title="Toggle layers" aria-label="Toggle layers"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <div class="fname" id="fileName"></div>
  </div>
  <div class="tb-right">
    <div class="avail"><i></i><span id="availText"></span></div>
    <button class="pbtn" id="viewBtn" type="button" title="Switch between the canvas and a normal scrolling page">Page view</button>
    <button class="iconbtn" id="themeBtnTop" title="Toggle dark/light mode" aria-label="Toggle theme"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 11.5A6.5 6.5 0 018.5 4 6.5 6.5 0 1016 11.5z"/></svg></button>
    <a class="pbtn" data-resume href="#">Resume ↓</a>
    <a class="pbtn primary" id="hireBtn" href="#">Hire Johnty</a>
  </div>
</div>

<aside class="ui" id="layers">
  <h4>Layers</h4>
  <div id="layerList"></div>
  <div class="layers-footer">
    <button class="drawer-view-btn" id="drawerSwitchView" type="button">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      <span>Switch to Canvas view</span>
      <span class="drawer-badge">✦</span>
    </button>
    <button class="drawer-view-btn secondary" id="drawerGuideBtn" type="button" style="margin-top: 6px;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 5h.01"/></svg>
      <span>Canvas Guide</span>
    </button>
  </div>
</aside>
<aside class="ui" id="inspect"><h4>Inspect</h4><div id="inspectBody"></div></aside>
<div id="navBackdrop" aria-hidden="true"></div>

<div class="ui" id="toolbar">
  <div id="tourbar" aria-label="Frame navigation">
    <button class="tbtn" id="tPrev" type="button" aria-label="Previous frame" title="Previous frame (←)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 8H5M8 4.5L4.5 8 8 11.5"/></svg></button>
    <div class="tinfo"><b id="tName">Cover</b><span id="tCount">1 / 1</span></div>
    <button class="tbtn" id="tNext" type="button" aria-label="Next frame" title="Next frame (→)"><span>Next</span><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h6M8 4.5l3.5 3.5-3.5 3.5"/></svg></button>
  </div>
  <div class="sep"></div>
  <button class="iconbtn" id="zOut" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10h10"/></svg></button>
  <div class="zr" id="zr">100%</div>
  <button class="iconbtn" id="zIn" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10h10M10 5v10"/></svg></button>
  <div class="sep"></div>
  <button class="iconbtn" id="fitBtn" title="Fit all (Shift+1)" aria-label="Fit all"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
  <button class="iconbtn on" id="pinsBtn" title="Designer comments: Visible (press C to toggle)" aria-label="Toggle comments"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4h12v9H9l-4 3v-3H4z"/></svg></button>
  <button class="iconbtn" id="themeBtn" title="Light or dark editor" aria-label="Theme"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 11.5A6.5 6.5 0 018.5 4 6.5 6.5 0 1016 11.5z"/></svg></button>
  <div class="sep"></div>
  <button class="iconbtn" id="simpleBtn" title="Switch to simple page view" aria-label="Simple view"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 7h6M7 10h6M7 13h3"/></svg></button>
</div>
<div class="ui" id="toast">Drag canvas to pan · Ctrl + scroll to zoom · Click any frame to inspect</div>

<div id="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle"></div>

<div id="tourGuide" class="ui" role="dialog" aria-modal="true" aria-labelledby="tgTitle">
  <div class="tg-card">
    <div class="tg-header">
      <span class="tg-badge"><span class="tg-dot"></span>Tour: Step <b id="tgStepNum">1</b> of <span id="tgTotalSteps">7</span></span>
      <button class="tg-close" id="tgClose" type="button" aria-label="Exit tour">✕</button>
    </div>
    <div class="tg-body">
      <h3 id="tgTitle">Cover & Overview</h3>
      <p id="tgText">Welcome! Explore Johnty's work as a UX & Product Designer specializing in enterprise software.</p>
    </div>
    <div class="tg-footer">
      <button class="tg-btn secondary" id="tgPrev" type="button">← Back</button>
      <div class="tg-dots" id="tgDots"></div>
      <button class="tg-btn primary" id="tgNext" type="button">Next step →</button>
    </div>
  </div>
</div>
<div id="lightbox"><img alt=""><p></p></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
